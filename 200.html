    <!-- GitHub Pages SPA redirect handler -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- PWA Splash Screen -->
    <div id="splash-screen" style="
      position: fixed;
      inset: 0;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
    ">
      <div style="
        animation: splashPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      ">
        <img src="/mascot.svg" alt="Kone Kids" width="140" height="140" style="width: 140px; height: 140px;" />
        <div style="text-align: center;">

            font-size: 2rem;
            font-weight: 800;
            font-style: italic;
            color: #0f172a;
            letter-spacing: -0.5px;
          ">Kone <span style="color: #f97316;">Kids</span></div>
          <div style="
            font-family: 'Nunito', sans-serif;
            font-size: 0.95rem;
            color: #64748b;
            margin-top: 0.25rem;
          ">Coding · Robotics · AI</div>
        </div>
        <!-- Loading dots -->
        <div style="display: flex; gap: 8px; margin-top: 0.5rem;">
          <span style="width:10px;height:10px;border-radius:50%;background:#f97316;animation:dotPulse 1.2s ease-in-out infinite 0s;display:block;"></span>
          <span style="width:10px;height:10px;border-radius:50%;background:#0ea5e9;animation:dotPulse 1.2s ease-in-out infinite 0.2s;display:block;"></span>
          <span style="width:10px;height:10px;border-radius:50%;background:#a855f7;animation:dotPulse 1.2s ease-in-out infinite 0.4s;display:block;"></span>
        </div>
      </div>
    </div>

    <style>
      @keyframes splashPop {
        from { transform: scale(0.7); opacity: 0; }
        to   { transform: scale(1);   opacity: 1; }
      }
      @keyframes dotPulse {
        0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
        40%           { transform: scale(1.2); opacity: 1; }
      }
    </style>

    <script>
      // Dismiss splash once the page is interactive or load event triggers (with safety timeout)
      (function() {
        var dismissed = false;
        function dismissSplash() {
          if (dismissed) return;
          dismissed = true;
          var splash = document.getElementById('splash-screen');
          if (splash) {
            splash.style.opacity = '0';
            splash.style.visibility = 'hidden';
            setTimeout(function() { splash.remove(); }, 500);
          }
        }

        if (document.readyState === 'complete') {
          dismissSplash();
        } else {
          // Try to dismiss as soon as DOM is interactive
          window.addEventListener('DOMContentLoaded', function() {
            setTimeout(dismissSplash, 800);
          });
          // Fallback to window load event
          window.addEventListener('load', dismissSplash);
          // Safety fallback: maximum 3.5 seconds to prevent hanging on blocked/slow resources
          setTimeout(dismissSplash, 3500);
        }
      })();
    </script>

    <div id="root"></div>
    
    <script>
      if ('serviceWorker' in navigator && !navigator.userAgent.includes('ReactSnap')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('[Kone Kids] SW registered:', reg.scope))
            .catch(err => console.warn('[Kone Kids] SW registration failed:', err));
        });
      }
    </script>
